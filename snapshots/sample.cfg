!
!华为S5735-L48T4X-A 样例配置 (脱敏)
!=============================================================================
!用途: 离线自检样例, 与 snapshots/10.10.1.11.cfg 内容一致
!  运行: cp snapshots/sample.cfg snapshots/10.10.1.11.cfg && ./run.sh --offline
!
!注意: 引擎按 devices.csv 中的 IP 读取 snapshots/<IP>.cfg,
!      因此本文件需要复制成对应设备的 IP 文件名后才能被离线模式加载。
!
!配置分段机制:
!  与真实 VRP display current-configuration 输出一致: 以单独的 '#' 行分段。
!=============================================================================
!
sysname SW-01-SAMPLE
#
snmp-agent community read cipher %^%#*~'Cz\,O8V(YfTrv5xgER!nUAU%^%#
snmp-agent community write cipher %^%#<]~RD(H,J+W;Z\,R2T\,uX\Dv]^,:B'^%#
snmp-agent sys-info version v2c
#
ntp-service unicast-server 10.1.1.100
#
vlan batch 10 20 30 50 200
#
interface Vlanif200
 description MGMT
 ip address 10.10.1.11 255.255.255.0
#
interface GigabitEthernet0/0/1
 description UPLINK-TO-CORE-01
 port link-type trunk
 port trunk allow-pass vlan 2 to 4094
 port trunk pvid vlan 999
#
interface GigabitEthernet0/0/2
 description AP-FLOOR3-01
 port link-type access
 port default vlan 10
 port-security enable
 port-security max-mac-num 4
 port-security protect-action shutdown
#
interface GigabitEthernet0/0/3
 description PC-FLOOR3-02
 port link-type access
 port default vlan 10
# 缺失: port-security enable  <-- 此口应被SW-PS-01检出
#
interface GigabitEthernet0/0/4
 description UNUSED
 shutdown
#
interface GigabitEthernet0/0/5
 description PRINTER-FLOOR3
 port link-type access
 port default vlan 20
 port-security enable
 port-security max-mac-num 2
#
interface GigabitEthernet0/0/24
 description DOWNLINK-SW-ACC-02
 port link-type trunk
 port trunk allow-pass vlan all
# 缺失: 裁剪trunk, 默认放行VLAN1  <-- 应被SW-VLAN1-01检出
#
acl 4000
 rule 5 deny l2-protocol 0x86dd
#
traffic classifier IPV6_DENY
 if-match acl 4000
#
traffic behavior IPV6_DENY
 deny
#
traffic policy IPV6_DENY
 classifier IPV6_DENY behavior IPV6_DENY
#
traffic-policy IPV6_DENY global inbound
#
acl 3000
 rule 5 deny udp destination-port eq 67
 rule 10 deny udp destination-port eq 68
#
traffic classifier DHCP_DENY
 if-match acl 3000
#
traffic behavior DHCP_DENY
 deny
#
traffic policy DHCP_DENY
 classifier DHCP_DENY behavior DHCP_DENY
#
traffic-policy DHCP_DENY global inbound
#
return
